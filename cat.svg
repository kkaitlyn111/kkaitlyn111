<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 72" width="800" height="72" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <filter id="rough" x="-5%" y="-10%" width="110%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.35" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="5"/>
    </filter>
  </defs>
  <style>
    .walk { animation: walk 24s linear infinite; }
    .bob { animation: bob 0.55s ease-in-out infinite alternate; }
    .leg { transform-box: fill-box; transform-origin: 50% 8%; animation: step 0.55s ease-in-out infinite alternate; }
    .leg.b { animation-delay: -0.55s; }
    .tail { transform-box: fill-box; transform-origin: 0% 40%; animation: swish 1.1s ease-in-out infinite alternate; }
    .o { stroke: #222226; stroke-width: 5; stroke-linejoin: round; stroke-linecap: round; }
    .coat { fill: #c5c8d0; }
    .wh { fill: #ffffff; }
    .shade { fill: #e4e5ea; }
    @keyframes walk { from { transform: translateX(-220px); } to { transform: translateX(820px); } }
    @keyframes bob { from { transform: translateY(0); } to { transform: translateY(-3px); } }
    @keyframes step { from { transform: rotate(-14deg); } to { transform: rotate(14deg); } }
    @keyframes swish { from { transform: rotate(-3deg); } to { transform: rotate(3deg); } }
  </style>
  <g class="walk">
