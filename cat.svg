            <path class="o" d="M622 318 L612 324 L624 330 L600 330 L606 338 L584 332 L584 342 L566 333 L560 342 L548 332 L538 340 L530 330 L514 334 L512 322 L500 318" fill="none" stroke-width="3.5"/>
