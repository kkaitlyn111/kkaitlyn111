<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 110" width="840" height="110" role="img" aria-label="A fluffy grey and white cat strolling across the banner">
  <defs>
    <filter id="crayon" x="-5%" y="-10%" width="110%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.09" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="5" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>
  <style>
    :root { --ln: #262626; --fur: #b4bbc7; --far: #9da5b2; --wh: #ffffff; --wh2: #eceef2; --shade: #dfe2e8; --pink: #e58c99; --shadow: #a3a3a3; }
    @media (prefers-color-scheme: dark) { :root { --shadow: #3d424a; } }
    .o { stroke: var(--ln); stroke-width: 6; stroke-linejoin: round; stroke-linecap: round; }
    .t { stroke: var(--ln); stroke-width: 4; stroke-linecap: round; fill: none; }

    .walker { animation: walk 20s linear infinite; }
    @keyframes walk { from { transform: translateX(-180px); } to { transform: translateX(900px); } }

    .bob { animation: bob 0.55s ease-in-out infinite alternate; }
    @keyframes bob { from { transform: translateY(0); } to { transform: translateY(-3px); } }

    .leg { transform-box: fill-box; transform-origin: 50% 0%; animation: stepA 1.1s ease-in-out infinite alternate; }
    .leg.B { animation-name: stepB; }
    @keyframes stepA { from { transform: rotate(24deg); } to { transform: rotate(-20deg); } }
    @keyframes stepB { from { transform: rotate(-20deg); } to { transform: rotate(24deg); } }

    .tail { transform-box: view-box; transform-origin: 375px 90px; animation: sway 2.2s ease-in-out infinite alternate; }
    @keyframes sway { from { transform: rotate(2.5deg); } to { transform: rotate(-3.5deg); } }
  </style>

  <g class="walker">
    <g transform="translate(0 28) scale(0.3)">
      <ellipse cx="270" cy="232" rx="250" ry="11" fill="var(--shadow)" opacity=".55"/>

      <g class="bob" filter="url(#crayon)">
        <!-- far legs -->
        <g class="leg B"><path class="o" fill="var(--far)" d="M174 120 Q175 180 180 220 Q173 229 186 231 L204 231 Q212 229 209 219 Q213 180 216 120 Z"/><path fill="var(--wh2)" d="M177.8 192 Q195 197 210.6 192 L209 219 Q212 229 204 231 L186 231 Q173 229 180 220 Z"/><path class="o" fill="none" d="M180 220 Q173 229 186 231 L204 231 Q212 229 209 219"/><path class="t" d="M187 224 l1 6 M195 224 l1 6"/></g>
        <g class="leg"><path class="o" fill="var(--far)" d="M297 120 Q298 180 303 220 Q296 229 309 231 L327 231 Q335 229 332 219 Q336 180 339 120 Z"/><path fill="var(--wh2)" d="M300.8 192 Q318 197 333.6 192 L332 219 Q335 229 327 231 L309 231 Q296 229 303 220 Z"/><path class="o" fill="none" d="M303 220 Q296 229 309 231 L327 231 Q335 229 332 219"/><path class="t" d="M310 224 l1 6 M318 224 l1 6"/></g>

        <!-- near legs -->
        <g class="leg"><path class="o" fill="var(--fur)" d="M119 128 Q120 188 125 220 Q118 229 131 231 L149 231 Q157 229 154 219 Q158 188 161 128 Z"/><path fill="var(--wh)" d="M122.8 192 Q140 197 155.6 192 L154 219 Q157 229 149 231 L131 231 Q118 229 125 220 Z"/><path class="o" fill="none" d="M125 220 Q118 229 131 231 L149 231 Q157 229 154 219"/><path class="t" d="M132 224 l1 6 M140 224 l1 6"/></g>
        <g class="leg B"><path class="o" fill="var(--fur)" d="M341 118 Q342 178 347 220 Q340 229 353 231 L371 231 Q379 229 376 219 Q380 178 383 118 Z"/><path fill="var(--wh)" d="M344.8 192 Q362 197 377.6 192 L376 219 Q379 229 371 231 L353 231 Q340 229 347 220 Z"/><path class="o" fill="none" d="M347 220 Q340 229 353 231 L371 231 Q379 229 376 219"/><path class="t" d="M354 224 l1 6 M362 224 l1 6"/></g>

        <!-- tail: grey plume with white fringe underneath -->
        <g class="tail">
          <path class="o" fill="var(--fur)" d="M366 64 C 420 78, 480 96, 548 112 C 520 120, 470 124, 420 122 C 398 120, 382 116, 368 112 Z"/>
          <path fill="var(--wh)" d="M402 118 C 450 123, 505 121, 546 113 l-14 10 8 3 -16 6 6 4 -18 3 4 6 -18 -1 2 6 -18 -4 2 6 -16 -6 C 420 140, 408 130, 402 118 Z"/>
          <path class="o" fill="none" d="M546 113 l-14 10 8 3 -16 6 6 4 -18 3 4 6 -18 -1 2 6 -18 -4 2 6 -16 -6 C 420 140, 408 130, 402 118"/>
          <path class="t" d="M470 130 l6 6 M440 132 l4 6"/>
        </g>

        <!-- body + head silhouette -->
        <path class="o" fill="var(--fur)" d="M20 132
          C 16 110, 26 88, 46 72
          C 62 56, 82 40, 112 30
          C 162 18, 262 18, 336 40
          C 368 50, 384 70, 386 96
          C 390 130, 378 158, 350 166
          C 300 174, 232 174, 190 168
          C 156 164, 118 152, 82 149
          C 56 149, 34 146, 20 132 Z"/>

        <!-- white cheek / chest ruff -->
        <path fill="var(--shade)" d="M60 146 C 90 150, 118 152, 140 158 C 120 140, 112 130, 106 124 Z"/>
        <path fill="var(--wh)" d="M22 134 C 30 128, 40 122, 50 118 l6 -16 6 12 8 -18 6 16 10 -10 0 14 12 -4 -6 14 C 104 146, 92 148, 72 149 C 48 149, 32 145, 22 134 Z"/>
        <!-- white belly fluff -->
        <path fill="var(--wh)" d="M196 168 C 250 172, 300 171, 356 164 C 348 174, 330 180, 300 180 l-8 -5 -8 6 -10 -5 -8 6 -10 -5 -10 5 -8 -5 C 228 180, 206 176, 196 168 Z"/>
        <path class="t" d="M300 180 l-8 -5 -8 6 -10 -5 -8 6 -10 -5 -10 5 -8 -5"/>

        <!-- ears -->
        <path class="o" fill="var(--fur)" d="M48 64 L52 12 L86 40 Z"/>
        <path fill="var(--pink)" d="M55 52 L56 24 L74 40 Z"/>
        <path class="o" fill="var(--far)" d="M24 72 L14 44 L44 58 Z"/>

        <!-- face -->
        <ellipse cx="38" cy="108" rx="3.6" ry="6.5" fill="var(--ln)"/>
        <path class="t" d="M-6 126 l13 2 M-4 135 l13 -3"/>
      </g>
    </g>
  </g>
</svg>
